# SPDX-License-Identifier: Apache-2.0
name: Source security
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sast-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s policies -p test_sast.py -v
  sast-javascript-typescript:
    if: ${{ github.event.repository.private == false }}
    name: sast-javascript-typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      GC_PUBLIC_REPOSITORY: ${{ github.repository }}
      GC_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin TypeScript extractor Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - name: Install verified public-project CodeQL bundle
        run: python3 policies/sast.py install --public-repository "$GC_PUBLIC_REPOSITORY"
      - name: Analyze exact source, verify extraction and apply findings policy
        id: scan
        run: python3 policies/sast.py run --language javascript-typescript --output .local/sast/run --public-repository "$GC_PUBLIC_REPOSITORY"
      - name: Upload analysis independently of the findings gate
        if: ${{ always() && hashFiles('.local/sast/run/public/javascript-typescript.sarif') != '' }}
        id: ingestion
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .local/sast/run/public/javascript-typescript.sarif
          category: governance-commons/javascript-typescript
          wait-for-processing: true
      - name: Record upload status without treating it as an analysis pass
        if: ${{ always() }}
        env:
          GC_SCAN_RESULT: ${{ steps.scan.outcome }}
          GC_UPLOAD_RESULT: ${{ steps.ingestion.outcome }}
          GC_SARIF_ID: ${{ steps.ingestion.outputs.sarif-id }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path('.local/sast/run/public')
          path.mkdir(parents=True, exist_ok=True)
          (path / 'upload-status.json').write_text(json.dumps({
            'schemaVersion': 1, 'language': 'javascript-typescript', 'commit': os.environ['GITHUB_SHA'],
            'analysisAndFindingsStep': os.environ['GC_SCAN_RESULT'],
            'uploadAndProcessingStep': os.environ['GC_UPLOAD_RESULT'],
            'sarifId': os.environ.get('GC_SARIF_ID', ''),
            'analysisReadBack': 'NOT_PERFORMED_BY_THIS_JOB'
          }, indent=2) + '\n')
          PYCODE
      - name: Preserve bounded reports including failed attempts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-javascript-typescript-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/sast/run/public/
          retention-days: 7
          if-no-files-found: error
  sast-python:
    if: ${{ github.event.repository.private == false }}
    name: sast-python
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      GC_PUBLIC_REPOSITORY: ${{ github.repository }}
      GC_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin Python extractor runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.5'
      - name: Install verified public-project CodeQL bundle
        run: python3 policies/sast.py install --public-repository "$GC_PUBLIC_REPOSITORY"
      - name: Analyze exact source, verify extraction and apply findings policy
        id: scan
        run: python3 policies/sast.py run --language python --output .local/sast/run --public-repository "$GC_PUBLIC_REPOSITORY"
      - name: Upload analysis independently of the findings gate
        if: ${{ always() && hashFiles('.local/sast/run/public/python.sarif') != '' }}
        id: ingestion
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .local/sast/run/public/python.sarif
          category: governance-commons/python
          wait-for-processing: true
      - name: Record upload status without treating it as an analysis pass
        if: ${{ always() }}
        env:
          GC_SCAN_RESULT: ${{ steps.scan.outcome }}
          GC_UPLOAD_RESULT: ${{ steps.ingestion.outcome }}
          GC_SARIF_ID: ${{ steps.ingestion.outputs.sarif-id }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path('.local/sast/run/public')
          path.mkdir(parents=True, exist_ok=True)
          (path / 'upload-status.json').write_text(json.dumps({
            'schemaVersion': 1, 'language': 'python', 'commit': os.environ['GITHUB_SHA'],
            'analysisAndFindingsStep': os.environ['GC_SCAN_RESULT'],
            'uploadAndProcessingStep': os.environ['GC_UPLOAD_RESULT'],
            'sarifId': os.environ.get('GC_SARIF_ID', ''),
            'analysisReadBack': 'NOT_PERFORMED_BY_THIS_JOB'
          }, indent=2) + '\n')
          PYCODE
      - name: Preserve bounded reports including failed attempts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/sast/run/public/
          retention-days: 7
          if-no-files-found: error
  sast-actions:
    if: ${{ github.event.repository.private == false }}
    name: sast-actions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      GC_PUBLIC_REPOSITORY: ${{ github.repository }}
      GC_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified public-project CodeQL bundle
        run: python3 policies/sast.py install --public-repository "$GC_PUBLIC_REPOSITORY"
      - name: Analyze exact source, verify extraction and apply findings policy
        id: scan
        run: python3 policies/sast.py run --language actions --output .local/sast/run --public-repository "$GC_PUBLIC_REPOSITORY"
      - name: Upload analysis independently of the findings gate
        if: ${{ always() && hashFiles('.local/sast/run/public/actions.sarif') != '' }}
        id: ingestion
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .local/sast/run/public/actions.sarif
          category: governance-commons/actions
          wait-for-processing: true
      - name: Record upload status without treating it as an analysis pass
        if: ${{ always() }}
        env:
          GC_SCAN_RESULT: ${{ steps.scan.outcome }}
          GC_UPLOAD_RESULT: ${{ steps.ingestion.outcome }}
          GC_SARIF_ID: ${{ steps.ingestion.outputs.sarif-id }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path('.local/sast/run/public')
          path.mkdir(parents=True, exist_ok=True)
          (path / 'upload-status.json').write_text(json.dumps({
            'schemaVersion': 1, 'language': 'actions', 'commit': os.environ['GITHUB_SHA'],
            'analysisAndFindingsStep': os.environ['GC_SCAN_RESULT'],
            'uploadAndProcessingStep': os.environ['GC_UPLOAD_RESULT'],
            'sarifId': os.environ.get('GC_SARIF_ID', ''),
            'analysisReadBack': 'NOT_PERFORMED_BY_THIS_JOB'
          }, indent=2) + '\n')
          PYCODE
      - name: Preserve bounded reports including failed attempts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sast-actions-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/sast/run/public/
          retention-days: 7
          if-no-files-found: error
  sast-required:
    if: ${{ always() }}
    needs: [sast-policy, sast-javascript-typescript, sast-python, sast-actions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every analysis, findings, policy and ingestion job
        env:
          POLICY: ${{ needs.sast-policy.result }}
          JAVASCRIPT: ${{ needs.sast-javascript-typescript.result }}
          PYTHON: ${{ needs.sast-python.result }}
          ACTIONS: ${{ needs.sast-actions.result }}
        run: |
          test "$POLICY" = success
          test "$JAVASCRIPT" = success
          test "$PYTHON" = success
          test "$ACTIONS" = success
